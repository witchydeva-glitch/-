<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0C7C82"><meta name="apple-mobile-web-app-capable" content="yes">
<title>ระบบบันทึกสถิติการวิ่ง</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{font-family:Sarabun,sans-serif;background:#f4fbfa;color:#1e3a3a}
.inp{width:100%;border:1px solid #cfe7e5;border-radius:.75rem;padding:.5rem .75rem;background:#fff}
.btn{background:#0C7C82;color:#fff;border-radius:.75rem;padding:.5rem 1rem}.btn:hover{background:#26A69A}
.card label,.card>b,.card>div>b{display:block}.card label{font-size:.875rem;color:#456}
.card{background:#fff;border-radius:1rem;box-shadow:0 2px 12px #0c7c8218;padding:1rem}
.nav a{display:flex;gap:.75rem;align-items:center;padding:.65rem 1rem;border-radius:.75rem;cursor:pointer}
.nav a.on,.nav a:hover{background:#e3f4f3;color:#0C7C82;font-weight:700}
.sk{background:linear-gradient(90deg,#e6f2f1 25%,#f6fbfb 50%,#e6f2f1 75%);background-size:200%;animation:s 1.2s infinite;border-radius:.75rem;height:5rem}@keyframes s{to{background-position:-200%}}
#spin{display:none;position:fixed;inset:0;background:#fff8;z-index:99;place-items:center}#spin i{font-size:2.5rem;color:#0C7C82}
.bd{padding:.1rem .6rem;border-radius:999px;font-size:.75rem;color:#fff}
@media print{aside,nav.mb,header,.np{display:none!important}main{margin:0!important}}
</style></head><body>
<div id="spin" class="grid"><i class="fa-solid fa-spinner fa-spin"></i></div>
<aside id="side" class="fixed inset-y-0 left-0 w-64 bg-white shadow-lg p-4 z-40 -translate-x-full md:translate-x-0 transition">
 <div class="flex items-center gap-2 mb-6"><div class="w-10 h-10 rounded-xl bg-[#0C7C82] text-white grid place-items-center"><i class="fa-solid fa-person-running"></i></div><b id="clubN" class="text-[#0C7C82]"></b></div>
 <div class="nav space-y-1" id="nav"></div>
 <button onclick="logout()" class="absolute bottom-4 left-4 right-4 text-[#EF5350]"><i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ</button>
</aside>
<header class="md:ml-64 p-3 flex items-center gap-3 bg-white shadow-sm sticky top-0 z-30"><button class="md:hidden" onclick="side.classList.toggle('-translate-x-full')"><i class="fa-solid fa-bars text-xl text-[#0C7C82]"></i></button><b id="title"></b><span class="ml-auto text-xs text-gray-400" id="sync"></span></header>
<main class="md:ml-64 p-4 pb-28" id="main"></main>
<nav class="mb md:hidden fixed bottom-0 inset-x-0 bg-white shadow-[0_-2px_12px_#0001] grid grid-cols-5 p-1 z-40" id="mnav"></nav>
<script>
const CFG={url:'https://script.google.com/macros/s/AKfycbyaIbKPq4MiRLdIIDz10qDBdXjOV96LlH0gR3sYwqhWal_gl6z1ZLJ2bKgdsiweTTgdIA/exec'};// วาง URL Web app (ลงท้าย /exec) ในเครื่องหมาย '' เพื่อให้ทุกเครื่องเชื่อมอัตโนมัติ
window.PIN=sessionStorage.getItem('pin')||'';
const $=s=>document.querySelector(s),K='runstats_v1';
const M=[['dash','Dashboard','fa-chart-pie','#0288D1'],['rec','บันทึกผล','fa-stopwatch','#26A69A'],['ath','นักกีฬา','fa-users','#FF8A65'],['awd','รางวัล','fa-trophy','#FFCA28'],['best','สถิติดีที่สุด','fa-medal','#AED581'],['rep','รายงาน','fa-print','#4A2C6D'],['set','ตั้งค่า','fa-gear','#EF5350']];
const D0={club:'สโมสรวิ่ง',url:'',folder:'RunStats',sid:'',surl:'',auto:true,names:{ath:'นักกีฬา',rec:'ผลวิ่ง',awd:'รางวัล'},dist:[30,50,60,'60+10',80,90,100,110,120,150,180,190,200,220,250,300],ath:[],rec:[],awd:[]};
let D={...D0,...(JSON.parse(localStorage.getItem(K)||'null')||{})},V='dash',ch={};if(!D.url&&CFG.url)D.url=CFG.url;
const uid=()=>Math.random().toString(36).slice(2,9),A=id=>(D.ath.find(a=>a.id==id)||{}).nick||'-';
const toast=(t,i='success')=>Swal.fire({toast:true,position:'top-end',timer:1800,showConfirmButton:false,icon:i,title:t});
const spin=on=>$('#spin').style.display=on?'grid':'none';
const sidOf=v=>{const m=(v||'').match(/\/d\/([\w-]+)/);return m?m[1]:(v||'').trim()};
const qs=()=>({sid:sidOf(D.sid),names:D.names,key:window.PIN||''});
const gq=(sid,n)=>'?sid='+encodeURIComponent(sidOf(sid))+'&names='+encodeURIComponent(JSON.stringify(n))+'&key='+encodeURIComponent(window.PIN||'');
async function push(){spin(1);try{const j=await(await fetch(D.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'save',data:D,...qs()})})).json();if(j.error)throw new Error(j.error);$('#sync').textContent='ซิงค์ Sheets แล้ว '+new Date().toLocaleTimeString('th-TH');return true}catch(e){Swal.fire('ซิงค์ Sheets ไม่สำเร็จ',e.message,'error');return false}finally{spin(0)}}
async function save(){localStorage.setItem(K,JSON.stringify(D));if(D.url&&D.auto!==false)await push()}
async function pull(){if(!D.url)return;spin(1);try{const r=await(await fetch(D.url+gq(D.sid,D.names))).json();if(r.error=='unauthorized'){spin(0);await Swal.fire('รหัสผ่านไม่ถูกต้อง','กรุณาลองใหม่','error');return false}if(r.error)throw new Error(r.error);if(r._ss)D.surl=r._ss.url;delete r._ss;const rn=(r.ath||[]).length+(r.rec||[]).length+(r.awd||[]).length,ln=D.ath.length+D.rec.length+D.awd.length;spin(0);if(!rn&&ln){await push()}else if(r.ath){D={...D,...r,url:D.url,sid:D.sid,names:D.names,auto:D.auto,surl:D.surl,folder:r.folder||D.folder}}localStorage.setItem(K,JSON.stringify(D));return true}catch(e){toast('โหลดจาก Sheets ไม่สำเร็จ: '+e.message,'error')}finally{spin(0)}}
function nav(){$('#nav').innerHTML=M.map(m=>`<a class="${V==m[0]?'on':''}" onclick="go('${m[0]}')"><i class="fa-solid ${m[2]}" style="color:${m[3]}"></i>${m[1]}</a>`).join('');
 $('#mnav').innerHTML=M.slice(0,5).map(m=>`<a onclick="go('${m[0]}')" class="text-center text-[10px] py-1"><div class="w-10 h-10 mx-auto rounded-2xl grid place-items-center text-white mb-0.5" style="background:${m[3]};${V==m[0]?'box-shadow:0 0 0 3px #0C7C8244':''}"><i class="fa-solid ${m[2]}"></i></div>${m[1]}</a>`).join('');
 $('#clubN').textContent=D.club;$('#clubN').previousElementSibling.innerHTML=D.logo?`<img src="${D.logo}" class="w-10 h-10 rounded-xl object-cover">`:'<i class="fa-solid fa-person-running"></i>';$('#title').textContent=M.find(m=>m[0]==V)[1]}
function go(v){V=v;side.classList.add('-translate-x-full');nav();$('#main').innerHTML='<div class="grid grid-cols-2 md:grid-cols-4 gap-3">'+'<div class="sk"></div>'.repeat(4)+'</div>';setTimeout(()=>{R[v]();},250)}
function bestMap(){const b={};D.rec.forEach(r=>{const k=r.ath+'|'+r.dist;if(!b[k]||+r.time<+b[k].time)b[k]=r});return b}
const fmt=r=>r.time+' ว',dt=d=>d?new Date(d).toLocaleDateString('th-TH'):'-';
function tbl(h,rows){return `<div class="card overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-[#0C7C82] border-b">${h.map(x=>`<th class="p-2">${x}</th>`).join('')}</tr><tr class="np">${h.map(x=>x?'<th class="p-1"><input class="inp !py-1 !text-xs" placeholder="กรอง" oninput="flt(this)"></th>':'<th></th>').join('')}</tr></thead><tbody>${rows.join('')||'<tr><td class="p-4 text-gray-400" colspan=9>ยังไม่มีข้อมูล</td></tr>'}</tbody></table></div>`}
function flt(el){const t=el.closest('table'),v=[...t.querySelectorAll('thead tr:nth-child(2) input')].map(i=>i.value.toLowerCase()),ix=[...t.querySelectorAll('thead tr:nth-child(2) th')].map((th,i)=>th.querySelector('input')?i:-1);t.querySelectorAll('tbody tr').forEach(tr=>{const c=tr.children;let k=0;tr.style.display=ix.filter(i=>i>=0).every(i=>{const q=v[k++];return !q||(c[i]&&c[i].textContent.toLowerCase().includes(q))})?'':'none'})}
const act=(t,id)=>`<td class="p-2 whitespace-nowrap np"><button onclick="edit('${t}','${id}')" class="text-[#0288D1] mr-3"><i class="fa-solid fa-pen"></i></button><button onclick="del('${t}','${id}')" class="text-[#EF5350]"><i class="fa-solid fa-trash"></i></button></td>`;
const av=a=>a.photo?`<img src="${a.photo}" class="w-8 h-8 rounded-full object-cover inline mr-2">`:'<i class="fa-solid fa-circle-user text-2xl text-[#35B4B0] mr-2"></i>';
function chart(id,type,labels,data,label){ch[id]&&ch[id].destroy();ch[id]=new Chart($('#'+id),{type,data:{labels,datasets:[{label,data,backgroundColor:['#0C7C82','#35B4B0','#AED581','#FFCA28','#FF8A65','#EF5350','#0288D1'],borderColor:'#0C7C82'}]},options:{responsive:true,plugins:{legend:{display:type=='doughnut'}}}})}
const R={
dash(){const tr=D.rec.filter(r=>r.type=='แข่งขัน').length,cs=[['นักกีฬา',D.ath.length,'#0C7C82','fa-users'],['ผลวิ่งทั้งหมด',D.rec.length,'#0288D1','fa-stopwatch'],['แข่งขัน',tr,'#FF8A65','fa-flag-checkered'],['รางวัล',D.awd.length,'#FFCA28','fa-trophy']];
 window.DB=Object.values(D.rec.reduce((m,r)=>{const c=m[r.dist];if(!c||+r.time<+c.time)m[r.dist]=r;return m},{})).sort((x,y)=>meters(x.dist)-meters(y.dist));
 if(!window.DSel||!DB.find(r=>r.dist==window.DSel))window.DSel=DB[0]&&DB[0].dist;
 $('#main').innerHTML=`<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">${cs.map(c=>`<div class="card flex items-center gap-3"><div class="w-12 h-12 rounded-2xl text-white grid place-items-center" style="background:${c[2]}"><i class="fa-solid ${c[3]}"></i></div><div><div class="text-2xl font-bold">${c[1]}</div><div class="text-xs text-gray-500">${c[0]}</div></div></div>`).join('')}</div>
 <div class="card mb-4"><div id="pinfo"></div><div><canvas id="c1" height="110"></canvas></div></div>
 <div><b class="text-[#0C7C82]"><i class="fa-solid fa-medal"></i> สถิติที่ดีที่สุดในแต่ละระยะ</b> <span class="text-xs text-gray-400">(คลิกแถวเพื่อดูกราฟเพซ/ความเร็ว)</span><div class="mt-2">${tbl(['ระยะ','สถิติดีที่สุด','เพซ (นาที/กม.)','กม./ชม.','นักกีฬา','วันที่','รายการ'],DB.map(r=>{const m=meters(r.dist);return `<tr class="border-b cursor-pointer" data-d="${r.dist}" onclick="pick('${r.dist}')"><td class="p-2">${r.dist} ม.</td><td><span class="bd" style="background:#0C7C82">${r.time} ว</span></td><td>${m?fp(pc(r.time,m)):'-'}</td><td>${m?(m/r.time*3.6).toFixed(1):'-'}</td><td>${A(r.ath)}</td><td>${dt(r.date)}</td><td>${r.event||r.type}</td></tr>`}))}</div></div>`;
 pace();},
rec(){$('#main').innerHTML=`<button class="btn mb-3" onclick="edit('rec')"><i class="fa-solid fa-plus"></i> เพิ่มผลวิ่ง</button>`+tbl([...RCH,''],[...D.rec].sort((a,b)=>b.date>a.date?1:-1).map(r=>trow({...r,dist:r.dist},act('rec',r.id))));},
ath(){$('#main').innerHTML=`<button class="btn mb-3" onclick="edit('ath')"><i class="fa-solid fa-plus"></i> เพิ่มนักกีฬา</button>`+tbl(['ชื่อเล่น','ชื่อ-สกุล','เกิด','อายุ','หมู่เลือด','จังหวัด','โรงเรียน','เอกสาร',''],D.ath.map(a=>`<tr class="border-b"><td class="p-2">${av(a)}${a.nick}</td><td>${a.name||''}</td><td>${dt(a.dob)}</td><td>${ageOf(a.dob)}</td><td>${a.blood||''}</td><td>${a.prov||''}</td><td>${a.school||''}</td><td>${['idc','house','o1','o2','o3'].filter(k=>a[k]).map(k=>`<a href="${a[k]}" target="_blank" download="${k}" class="text-[#0288D1] mr-1"><i class="fa-solid fa-file"></i></a>`).join('')}</td>${act('ath',a.id)}</tr>`));},
awd(){const rows=[...D.awd].sort((a,b)=>b.date>a.date?1:-1).map(w=>{const x=D.rec.find(y=>y.id==w.rid)||{};return trow({date:w.date,ath:w.ath,type:x.type||'แข่งขัน',round:x.round,event:w.event,place:x.place,dist:w.dist||x.dist,time:x.time,pos:w.pos||x.pos,prize:w.rank,by:x.by,timer:x.timer},`<td>${w.age||'-'}</td><td>${w.photo?`<img src="${w.photo}" class="h-10 w-10 rounded-lg object-cover">`:'-'}</td>`+act('awd',w.id))});
$('#main').innerHTML=`<button class="btn mb-3" onclick="edit('awd')"><i class="fa-solid fa-plus"></i> เพิ่มรางวัล</button>`+tbl([...RCH,'รุ่นอายุ','รูป',''],rows)},
best(){const f=window.BF||'',L=Object.values(bestMap()).filter(r=>!f||r.ath==f).sort((x,y)=>meters(x.dist)-meters(y.dist)||String(A(x.ath)).localeCompare(A(y.ath)));
$('#main').innerHTML=`<select class="inp md:w-72 mb-3" onchange="window.BF=this.value;R.best()"><option value="">ทุกคน</option>${D.ath.map(a=>`<option value="${a.id}" ${f==a.id?'selected':''}>${a.nick}</option>`).join('')}</select>`+tbl(RHD,L.map(rrow));},
rep(){const ds=[...new Set(D.rec.map(r=>String(r.dist)))].sort((a,b)=>meters(a)-meters(b)),I=(k,l,t='number',ex='step="any"')=>`<label>${l}<input class="inp" type="${t}" ${ex} value="${RF[k]}" oninput="RF.${k}=this.value;repApply()"></label>`;
$('#main').innerHTML=`<div class="card np mb-3"><div class="flex items-center mb-2"><b class="text-[#0C7C82]"><i class="fa-solid fa-filter"></i> ตัวกรองรายงาน</b><button class="btn ml-auto" onclick="print()"><i class="fa-solid fa-print"></i> พิมพ์รายงาน</button></div><div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-sm">
<label>ชื่อนักกีฬา<select class="inp" onchange="RF.ath=this.value;repApply()"><option value="">ทุกคน</option>${D.ath.map(a=>`<option value="${a.id}" ${RF.ath==a.id?'selected':''}>${a.nick}</option>`).join('')}</select></label>
<label>ระยะ<select class="inp" onchange="RF.dist=this.value;repApply()"><option value="">ทุกระยะ</option>${ds.map(d=>`<option value="${d}" ${RF.dist==d?'selected':''}>${d} ม.</option>`).join('')}</select></label>
<label>แสดง<select class="inp" onchange="RF.mode=this.value;repApply()"><option value="all">ผลวิ่งทั้งหมด</option><option value="best" ${RF.mode=='best'?'selected':''}>สถิติดีที่สุดต่อระยะ</option></select></label><span></span>
${I('amin','อายุตั้งแต่ (ปี)')}${I('amax','อายุถึง (ปี)')}${I('pmin','เพซตั้งแต่ (นาที/กม.)')}${I('pmax','เพซถึง')}${I('smin','ความเร็วตั้งแต่ (กม./ชม.)')}${I('smax','ความเร็วถึง')}${I('d1','วันที่ตั้งแต่','date','')}${I('d2','วันที่ถึง','date','')}</div><button class="text-xs text-[#EF5350] mt-2" onclick="Object.keys(RF).forEach(k=>RF[k]=k=='mode'?'all':'');R.rep()">ล้างตัวกรอง</button></div><div id="rres"></div>`;repApply()},
set(){const L=D.logo?`<img src="${D.logo}" class="w-16 h-16 rounded-2xl object-cover">`:'<div class="w-16 h-16 rounded-2xl bg-[#e3f4f3] grid place-items-center text-[#0C7C82]"><i class="fa-solid fa-image"></i></div>';
$('#main').innerHTML=`<div class="grid md:grid-cols-2 gap-4"><div class="card space-y-3"><b class="text-[#0C7C82]"><i class="fa-solid fa-flag"></i> ข้อมูลสโมสร</b><div class="flex items-center gap-3">${L}<input id="s_logo" type="file" accept="image/*" class="inp"></div><label>ชื่อสโมสร<input id="s1" class="inp" value="${D.club}"></label><label>ที่อยู่<textarea id="s5" rows="3" class="inp">${D.addr||''}</textarea></label><label>เบอร์โทร<input id="s6" class="inp" value="${D.tel||''}"></label><label>ระยะวิ่ง (คั่นด้วย ,)<input id="s3" class="inp" value="${D.dist.join(',')}"></label></div>
<div class="space-y-4"><div class="card space-y-3"><b class="text-[#0C7C82]"><i class="fa-brands fa-google-drive"></i> เชื่อม Google</b><label>Google Apps Script URL<input id="s2" class="inp" value="${D.url}" placeholder="https://script.google.com/macros/s/.../exec"></label><label>โฟลเดอร์เก็บรูปใน Drive (ชื่อ หรือ Folder ID)<input id="s4" class="inp" value="${D.folder||'RunStats'}"></label>
<label>Google Sheet ปลายทาง (ลิงก์หรือ Spreadsheet ID — เว้นว่าง = ไฟล์ที่ผูกกับสคริปต์)<input id="s7" class="inp" value="${D.sid||''}" placeholder="https://docs.google.com/spreadsheets/d/..."></label>
<div class="grid grid-cols-3 gap-2"><label>ชีตนักกีฬา<input id="s8" class="inp" value="${D.names.ath}"></label><label>ชีตผลวิ่ง<input id="s9" class="inp" value="${D.names.rec}"></label><label>ชีตรางวัล<input id="s10" class="inp" value="${D.names.awd}"></label></div>
<label><input id="s11" type="checkbox" ${D.auto!==false?'checked':''}> ซิงค์อัตโนมัติทุกครั้งที่เพิ่ม/แก้ไข/ลบ</label></div>
<div class="card"><div class="flex items-center mb-2"><b class="text-[#0C7C82]"><i class="fa-solid fa-folder-open"></i> เอกสารที่เกี่ยวข้อง</b><button class="btn ml-auto !py-1" onclick="addDoc()"><i class="fa-solid fa-plus"></i></button></div>${(D.docs||[]).map((d,i)=>`<div class="flex items-center gap-2 py-1 border-b"><i class="fa-solid fa-file text-[#0288D1]"></i><a href="${d.url}" target="_blank" class="flex-1 truncate">${d.name}</a><button onclick="delDoc(${i})" class="text-[#EF5350]"><i class="fa-solid fa-trash"></i></button></div>`).join('')||'<p class="text-sm text-gray-400">ยังไม่มีเอกสาร</p>'}</div></div></div>
